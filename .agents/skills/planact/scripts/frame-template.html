<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanAct Visual Companion</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #172033;
      line-height: 1.5;
    }
    .page {
      max-width: 1480px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    .hero {
      background: linear-gradient(135deg, #ffffff 0%, #edf4ff 100%);
      border: 1px solid #d9e5fb;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 14px 36px rgba(27, 73, 145, 0.08);
    }
    .eyebrow {
      color: #4a6fa6;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.2;
    }
    .intro {
      margin: 0;
      color: #51627d;
      max-width: 840px;
    }
    .status-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 18px 0 0;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      background: #eef4ff;
      color: #305a96;
    }
    .pill.complete {
      background: #e7f7ee;
      color: #267a49;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    .decision {
      background: #ffffff;
      border: 1px solid #dbe5f4;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(15, 35, 70, 0.05);
    }
    .decision-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }
    .decision-title {
      margin: 0;
      font-size: 20px;
    }
    .decision-description {
      margin: 6px 0 0;
      color: #55657f;
      font-size: 14px;
    }
    .badge {
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      background: #eef4ff;
      color: #305a96;
    }
    .badge.optional {
      background: #f1f3f7;
      color: #68768c;
    }
    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 16px;
      margin: 16px 0;
    }
    .option-card {
      border: 1px solid #d5dfef;
      border-radius: 16px;
      background: #fbfdff;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
      overflow: hidden;
    }
    .option-card:hover {
      border-color: #6b97d8;
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(42, 92, 170, 0.08);
    }
    .option-card.selected {
      border-color: #2563eb;
      background: #eef4ff;
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.12);
    }
    .mockup-wrap {
      aspect-ratio: 16 / 10;
      background: #e7edf6;
      border-bottom: 1px solid #d5dfef;
      overflow: hidden;
    }
    .mockup-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
      pointer-events: none;
    }
    .option-select {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 5px 12px;
      width: 100%;
      border: 0;
      padding: 14px 16px;
      text-align: left;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    .option-label {
      display: block;
      font-size: 15px;
      font-weight: 700;
    }
    .option-description {
      display: block;
      grid-column: 1;
      font-size: 13px;
      color: #55657f;
    }
    .option-action {
      grid-column: 2;
      grid-row: 1 / span 2;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      color: #305a96;
      background: #eef4ff;
    }
    .option-card.selected .option-action {
      color: #ffffff;
      background: #2563eb;
    }
    .note-wrap {
      margin-top: 14px;
    }
    .note-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #41526d;
      margin-bottom: 6px;
    }
    .note-input {
      width: 100%;
      min-height: 88px;
      resize: vertical;
      border: 1px solid #d5dfef;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      color: inherit;
      background: #ffffff;
    }
    .decision-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
    }
    .submit-btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 700;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
    }
    .submit-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .answer-state {
      font-size: 13px;
      color: #5f6f88;
    }
    .answer-state.saved {
      color: #267a49;
      font-weight: 700;
    }
    .footer-banner {
      margin-top: 24px;
      border-radius: 18px;
      padding: 18px 20px;
      background: #ffffff;
      border: 1px solid #dbe5f4;
      box-shadow: 0 8px 24px rgba(15, 35, 70, 0.05);
      color: #4c5d77;
      font-size: 14px;
    }
    .footer-banner.complete {
      background: #e8f7ee;
      border-color: #bfe1cb;
      color: #1f6f43;
      font-weight: 700;
    }
    @media (max-width: 560px) {
      .page { padding: 20px 12px 32px; }
      .options { grid-template-columns: 1fr; }
      .decision-head { flex-direction: column; }
      .mockup-wrap { aspect-ratio: 4 / 3; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div id="app"></div>
  </div>
</body>
</html>
